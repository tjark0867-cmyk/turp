name: APK bauen

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    # Reine Server-Änderungen brauchen keine neue App-Version
    paths-ignore:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase.yml"
      - ".github/workflows/server-check.yml"
      - ".github/workflows/sticker-photos.yml"
      - "tools/**"
      - ".github/scripts/last-run.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Firebase-Konfiguration besorgen: entweder direkt aus dem Secret
      # GOOGLE_SERVICES_JSON oder automatisch über den Dienstkonto-Schlüssel.
      - name: Firebase-Konfiguration holen
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "google-services.json liegt im Repository"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json aus dem Secret eingesetzt"
          elif [ -n "$SA" ]; then
            python3 .github/scripts/service_account.py "$RUNNER_TEMP/sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
            P=$(jq -r .project_id "$RUNNER_TEMP/sa.json")
            FB="npx --yes firebase-tools@latest"
            $FB projects:addfirebase "$P" --non-interactive > /dev/null 2>&1 || true
            APP=$($FB apps:list ANDROID --project "$P" --json \
              | jq -r '.result[]? | select(.packageName=="app.turp" or .namespace=="app.turp") | .appId' | head -n 1)
            if [ -z "$APP" ]; then
              echo "Android-App app.turp wird in Firebase registriert"
              APP=$($FB apps:create ANDROID turp --package-name app.turp --project "$P" --json | jq -r '.result.appId')
            fi
            echo "Firebase-App: $APP"
            $FB apps:sdkconfig ANDROID "$APP" --project "$P" --json \
              | jq -r '.result.fileContents // (.result.sdkConfig | tojson)' > app/google-services.json
            jq -e '.project_info.project_id' app/google-services.json
          else
            echo "Keine Firebase-Daten - App wird ohne Firebase gebaut"
          fi

      # Immer denselben Signatur-Schlüssel benutzen, damit Updates sich
      # ohne Deinstallieren über die alte Version installieren lassen.
      # Der Schlüssel liegt geschützt im Secret Manager des Firebase-Projekts
      # (Secret ANDROID_SIGNING_KEY) und wird beim allerersten Build erzeugt.
      - uses: google-github-actions/setup-gcloud@v2

      - name: Signatur-Schlüssel holen
        id: signing
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning title=Signatur::Kein Dienstkonto hinterlegt - Updates in der App funktionieren so nicht."
            exit 0
          fi
          python3 .github/scripts/service_account.py "$RUNNER_TEMP/sa.json" > /dev/null
          P=$(jq -r .project_id "$RUNNER_TEMP/sa.json")
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          KS="$RUNNER_TEMP/turp-signing.p12"
          PW="turp-signing"
          get() {
            gcloud secrets versions access latest --secret=ANDROID_SIGNING_KEY --project "$P" 2>/dev/null | base64 -d > "$KS"
            [ -s "$KS" ]
          }
          if get; then
            echo "Gespeicherter Signatur-Schlüssel wird benutzt"
          else
            echo "Neuer Signatur-Schlüssel wird erstellt und gespeichert"
            gcloud services enable secretmanager.googleapis.com --project "$P"
            rm -f "$KS"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias turp -keyalg RSA -keysize 2048 \
              -validity 12000 -storepass "$PW" -keypass "$PW" -dname "CN=turp, O=turp"
            # Falls ein anderer Build gleichzeitig schon einen angelegt hat, den benutzen
            base64 -w0 "$KS" | gcloud secrets create ANDROID_SIGNING_KEY --data-file=- \
              --replication-policy=automatic --project "$P" > /dev/null || get
          fi
          keytool -list -keystore "$KS" -storepass "$PW" -alias turp | tail -1
          echo "store=$KS" >> "$GITHUB_OUTPUT"
          echo "password=$PW" >> "$GITHUB_OUTPUT"

      # Schrift "Lilita One" (SIL Open Font License) – wird beim Bauen geladen
      - name: Schrift laden
        run: |
          mkdir -p app/src/main/res/font app/src/main/assets/licenses
          URL="https://raw.githubusercontent.com/google/fonts/main/ofl/lilitaone"
          for i in 1 2 3; do
            curl -fsSL -o app/src/main/res/font/lilita_one.ttf "$URL/LilitaOne-Regular.ttf" && break
            sleep 5
          done
          curl -fsSL -o app/src/main/assets/licenses/LilitaOne-OFL.txt "$URL/OFL.txt" || true
          test -s app/src/main/res/font/lilita_one.ttf
          # "Permanent Marker" (Apache 2.0) für handgeschriebene Stellen
          M="https://raw.githubusercontent.com/google/fonts/main/apache/permanentmarker"
          for i in 1 2 3; do
            curl -fsSL -o app/src/main/res/font/permanent_marker.ttf "$M/PermanentMarker-Regular.ttf" && break
            sleep 5
          done
          curl -fsSL -o app/src/main/assets/licenses/PermanentMarker-LICENSE.txt "$M/LICENSE.txt" || true
          # Notfalls die Lilita-Schrift nehmen, damit der Bau nicht scheitert
          test -s app/src/main/res/font/permanent_marker.ttf || cp app/src/main/res/font/lilita_one.ttf app/src/main/res/font/permanent_marker.ttf

      - name: APK bauen
        id: build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --console=plain \
            -PversionCode=${{ github.run_number }} -PupdateRepo=${{ github.repository }} \
            -PsigningStore="${{ steps.signing.outputs.store }}" -PsigningPassword="${{ steps.signing.outputs.password }}" \
            2>&1 | tee build.log

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: turp-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Fertige APK zusätzlich im Branch "apk" ablegen – direkter Download-Link:
      # https://github.com/<konto>/<repo>/raw/apk/turp.apk
      - name: APK im Branch "apk" ablegen
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/turp.apk
          # Infos für die Update-Prüfung in der App
          jq -n --argjson code ${{ github.run_number }} --arg name "1.0.${{ github.run_number }}" \
            --arg notes "$(git log -1 --pretty=%s)" \
            '{versionCode: $code, versionName: $name, apk: "turp.apk", notes: $notes}' > /tmp/version.json
          git config user.name "turp-bot"
          git config user.email "turp-bot@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rf --quiet .
          cp /tmp/turp.apk turp.apk
          cp /tmp/version.json version.json
          git add turp.apk version.json
          git commit -m "APK aus Build ${GITHUB_RUN_NUMBER}"
          git push -f origin apk

      # Bei Fehlern: Fehlermeldungen als Hinweis anzeigen und das komplette
      # Protokoll im Branch "build-logs" ablegen, damit man es leicht lesen kann.
      - name: Fehler zusammenfassen
        if: failure() && steps.build.outcome == 'failure'
        run: |
          grep -E "^e: |error:|What went wrong|^> |Could not|FAILURE|Execution failed" build.log | head -120 > errors.txt || true
          msg=$(sed -e 's/%/%25/g' -e 's/\r//g' errors.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build-Fehler::${msg}"

      - name: Protokoll speichern
        if: failure() && steps.build.outcome == 'failure'
        run: |
          cp build.log /tmp/build.log
          git config user.name "turp-bot"
          git config user.email "turp-bot@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -rf --quiet .
          cp /tmp/build.log build.log
          git add build.log
          git commit -m "Build-Protokoll ${GITHUB_RUN_NUMBER}"
          git push -f origin build-logs
