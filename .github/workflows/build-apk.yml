name: APK bauen

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Firebase-Konfiguration besorgen: entweder direkt aus dem Secret
      # GOOGLE_SERVICES_JSON oder automatisch über den Dienstkonto-Schlüssel.
      - name: Firebase-Konfiguration holen
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "google-services.json liegt im Repository"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json aus dem Secret eingesetzt"
          elif [ -n "$SA" ]; then
            python3 .github/scripts/service_account.py "$RUNNER_TEMP/sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
            P=$(jq -r .project_id "$RUNNER_TEMP/sa.json")
            FB="npx --yes firebase-tools@latest"
            $FB projects:addfirebase "$P" --non-interactive > /dev/null 2>&1 || true
            APP=$($FB apps:list ANDROID --project "$P" --json \
              | jq -r '.result[]? | select(.packageName=="app.turp" or .namespace=="app.turp") | .appId' | head -n 1)
            if [ -z "$APP" ]; then
              echo "Android-App app.turp wird in Firebase registriert"
              APP=$($FB apps:create ANDROID turp --package-name app.turp --project "$P" --json | jq -r '.result.appId')
            fi
            echo "Firebase-App: $APP"
            $FB apps:sdkconfig ANDROID "$APP" --project "$P" --json \
              | jq -r '.result.fileContents // (.result.sdkConfig | tojson)' > app/google-services.json
            jq -e '.project_info.project_id' app/google-services.json
          else
            echo "Keine Firebase-Daten - App wird ohne Firebase gebaut"
          fi

      - name: APK bauen
        id: build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: turp-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Fertige APK zusätzlich im Branch "apk" ablegen – direkter Download-Link:
      # https://github.com/<konto>/<repo>/raw/apk/turp.apk
      - name: APK im Branch "apk" ablegen
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/turp.apk
          git config user.name "turp-bot"
          git config user.email "turp-bot@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rf --quiet .
          cp /tmp/turp.apk turp.apk
          git add turp.apk
          git commit -m "APK aus Build ${GITHUB_RUN_NUMBER}"
          git push -f origin apk

      # Bei Fehlern: Fehlermeldungen als Hinweis anzeigen und das komplette
      # Protokoll im Branch "build-logs" ablegen, damit man es leicht lesen kann.
      - name: Fehler zusammenfassen
        if: failure() && steps.build.outcome == 'failure'
        run: |
          grep -E "^e: |error:|What went wrong|^> |Could not|FAILURE|Execution failed" build.log | head -120 > errors.txt || true
          msg=$(sed -e 's/%/%25/g' -e 's/\r//g' errors.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build-Fehler::${msg}"

      - name: Protokoll speichern
        if: failure() && steps.build.outcome == 'failure'
        run: |
          cp build.log /tmp/build.log
          git config user.name "turp-bot"
          git config user.email "turp-bot@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -rf --quiet .
          cp /tmp/build.log build.log
          git add build.log
          git commit -m "Build-Protokoll ${GITHUB_RUN_NUMBER}"
          git push -f origin build-logs
