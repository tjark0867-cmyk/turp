name: Server einrichten

# Richtet das Firebase-Projekt ein und lädt Server-Logik, Regeln und Indizes hoch.
# Braucht das Secret FIREBASE_SERVICE_ACCOUNT (JSON-Schlüssel eines Dienstkontos mit Rolle "Inhaber").
# Optional: ADMIN_EMAILS, GMAIL_ADDRESS + GMAIL_APP_PASSWORD (für die Eltern-E-Mails).
# Start: Actions → "Server einrichten" → Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
      - ".github/workflows/firebase.yml"
      - ".github/scripts/**"

permissions:
  contents: write

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Zugang prüfen
        id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error title=Secret fehlt::Lege im Repository das Secret FIREBASE_SERVICE_ACCOUNT an (Inhalt der JSON-Schlüsseldatei)."
            exit 1
          fi
          python3 .github/scripts/service_account.py "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - uses: google-github-actions/setup-gcloud@v2

      - name: Bei Google anmelden
        run: |
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          gcloud config set project "${{ steps.check.outputs.project }}" --quiet

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Einrichten und hochladen
        id: deploy
        env:
          P: ${{ steps.check.outputs.project }}
          ADMIN: ${{ secrets.ADMIN_EMAILS }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          set -o pipefail
          {
            echo "== Google-Dienste einschalten"
            gcloud services enable \
              firebase.googleapis.com firestore.googleapis.com identitytoolkit.googleapis.com \
              cloudfunctions.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com \
              run.googleapis.com eventarc.googleapis.com pubsub.googleapis.com cloudscheduler.googleapis.com \
              secretmanager.googleapis.com vision.googleapis.com videointelligence.googleapis.com \
              firebasestorage.googleapis.com firebaserules.googleapis.com storage.googleapis.com \
              fcm.googleapis.com firebaseinstallations.googleapis.com iam.googleapis.com \
              cloudresourcemanager.googleapis.com androidpublisher.googleapis.com \
              --project "$P"

            echo "== Firebase hinzufügen (falls noch nicht geschehen)"
            npx --yes firebase-tools@latest projects:addfirebase "$P" --non-interactive || true

            echo "== Datenbank anlegen (Frankfurt)"
            gcloud firestore databases create --location=europe-west3 --project "$P" --quiet || true
            gcloud firestore databases describe --database="(default)" --project "$P" --format="value(locationId)"

            echo "== E-Mail/Passwort-Login einschalten"
            TOKEN=$(gcloud auth print-access-token)
            API="https://identitytoolkit.googleapis.com"
            HDR=(-H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $P" -H "Content-Type: application/json")
            if curl -sS "${HDR[@]}" "$API/admin/v2/projects/$P/config" | grep -q CONFIGURATION_NOT_FOUND; then
              echo "Authentication wird zum ersten Mal eingerichtet"
              curl -sS -X POST "${HDR[@]}" "$API/v2/projects/$P/identityPlatform:initializeAuth" -d '{}' | head -c 300; echo
              sleep 10
            fi
            curl -sS -X PATCH "${HDR[@]}" \
              "$API/admin/v2/projects/$P/config?updateMask=signIn.email.enabled,signIn.email.passwordRequired" \
              -d '{"signIn":{"email":{"enabled":true,"passwordRequired":true}}}' > auth.json
            if grep -q '"enabled": true' auth.json; then echo "E-Mail/Passwort-Login ist aktiv"; else cat auth.json; echo "::warning title=Login::E-Mail/Passwort-Login konnte nicht automatisch eingeschaltet werden."; fi

            echo "== Rechte für die Server-Funktionen"
            NUM=$(gcloud projects describe "$P" --format='value(projectNumber)')
            for ROLE in roles/editor roles/cloudbuild.builds.builder roles/secretmanager.secretAccessor; do
              for TRY in 1 2 3 4 5; do
                if gcloud projects add-iam-policy-binding "$P" \
                  --member="serviceAccount:${NUM}-compute@developer.gserviceaccount.com" \
                  --role="$ROLE" --condition=None --quiet > /dev/null 2> iam.err; then
                  echo "Rolle $ROLE gesetzt"; break
                fi
                if [ "$TRY" = 5 ]; then cat iam.err; exit 1; fi
                sleep $((TRY * 5))
              done
            done

            echo "== E-Mail-Versand (optional)"
            if [ -n "$GMAIL_ADDRESS" ] && [ -n "$GMAIL_APP_PASSWORD" ]; then
              SMTP=$(python3 -c "import os,urllib.parse as u; print('smtps://'+u.quote(os.environ['GMAIL_ADDRESS'].strip(),safe='')+':'+u.quote(os.environ['GMAIL_APP_PASSWORD'].replace(' ','').strip(),safe='')+'@smtp.gmail.com:465')")
              echo "Gmail-Versand wird eingerichtet"
            else
              SMTP="none"
              echo "Kein Gmail-Zugang hinterlegt - Eltern-E-Mails werden noch nicht verschickt"
            fi
            if gcloud secrets describe SMTP_URI --project "$P" > /dev/null 2>&1; then
              printf '%s' "$SMTP" | gcloud secrets versions add SMTP_URI --data-file=- --project "$P" > /dev/null
            else
              printf '%s' "$SMTP" | gcloud secrets create SMTP_URI --data-file=- --replication-policy=automatic --project "$P" > /dev/null
            fi

            echo "== Admin-Adressen"
            printf 'ADMIN_EMAILS=%s\n' "$ADMIN" > functions/.env

            echo "== Abhängigkeiten installieren"
            npm install --prefix functions --no-audit --no-fund

            echo "== Regeln und Indizes hochladen"
            npx --yes firebase-tools@latest deploy --only firestore --project "$P" --force --non-interactive

            echo "== Server-Funktionen hochladen"
            ok=0
            for i in 1 2 3; do
              if npx --yes firebase-tools@latest deploy --only functions --project "$P" --force --non-interactive; then
                ok=1; break
              fi
              echo "Neuer Versuch in 90 Sekunden (beim ersten Mal brauchen Google-Rechte etwas Zeit)"
              sleep 90
            done
            [ "$ok" = 1 ]

            # Funktionen, die die App direkt aufruft, müssen öffentlich erreichbar sein
            # (die Anmeldung prüft der Code selbst). Fehlt das Recht, meldet die App
            # "UNAUTHENTICATED". Auslöser- und Zeitplan-Funktionen bleiben privat.
            echo "== Aufrufrechte der App-Funktionen prüfen"
            gcloud functions list --regions=europe-west3 --project "$P" --format=json > fns.json
            jq -r '.[] | select(.environment == "GEN_2" and .eventTrigger == null)
              | select((.labels["deployment-scheduled"] // "") != "true" and (.labels["deployment-taskqueue"] // "") != "true")
              | .serviceConfig.service | split("/") | last' fns.json > public.txt
            echo "Privat (Auslöser/Zeitplan): $(jq -r '[.[] | select(.eventTrigger != null or (.labels["deployment-scheduled"] // "") == "true") | .name | split("/") | last] | join(", ")' fns.json)"
            while read -r SVC; do
              [ -z "$SVC" ] && continue
              if gcloud run services get-iam-policy "$SVC" --region europe-west3 --project "$P" --format=json \
                | jq -e '.bindings[]? | select(.role == "roles/run.invoker") | .members[] | select(. == "allUsers")' > /dev/null; then
                echo "$SVC: erreichbar"
              else
                echo "$SVC: Aufrufrecht fehlte - wird gesetzt"
                gcloud run services add-iam-policy-binding "$SVC" --region europe-west3 --project "$P" \
                  --member=allUsers --role=roles/run.invoker --quiet > /dev/null
              fi
            done < public.txt

            # Dieses Dienstkonto muss in der Play Console eingeladen werden, damit Käufe geprüft werden können
            echo "== Dienstkonto für Google-Play-Käufe"
            gcloud functions describe verifyPurchase --region europe-west3 --project "$P" \
              --format="value(serviceConfig.serviceAccountEmail)" 2>/dev/null || true

            echo "== Speicher einrichten"
            TOKEN=$(gcloud auth print-access-token)
            FS="https://firebasestorage.googleapis.com/v1alpha/projects/$P/defaultBucket"
            if ! curl -sS -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $P" "$FS" | grep -q '"name"'; then
              echo "Standard-Speicher wird angelegt"
              curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $P" -H "Content-Type: application/json" \
                "$FS" -d '{"location":"europe-west3","storageClass":"REGIONAL"}' | head -c 600; echo
              sleep 15
            fi
            curl -sS -H "Authorization: Bearer $TOKEN" -H "X-Goog-User-Project: $P" "$FS" | head -c 400; echo

            echo "== Speicher-Regeln hochladen"
            if ! npx --yes firebase-tools@latest deploy --only storage --project "$P" --force --non-interactive; then
              echo "::warning title=Storage::Speicher-Regeln konnten nicht hochgeladen werden. Bitte in Firebase unter Storage auf 'Loslegen' tippen."
            fi
            echo "== Fertig"
          } 2>&1 | tee deploy.log

      - name: Fehler zusammenfassen
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          grep -E "Error|error|ERROR|denied|PERMISSION|billing|Billing|not found|failed|Failed" deploy.log | grep -v "^\s*$" | tail -60 > errors.txt || true
          msg=$(sed -e 's/%/%25/g' -e 's/\r//g' errors.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Server-Fehler::${msg}"

      - name: Protokoll speichern
        if: always() && steps.deploy.outcome != 'skipped'
        run: |
          [ -f deploy.log ] || exit 0
          sed -E 's/(smtps:\/\/)[^@]*@/\1***@/g' deploy.log > /tmp/deploy.log
          git config user.name "turp-bot"
          git config user.email "turp-bot@users.noreply.github.com"
          git fetch -q origin build-logs || true
          git checkout -q --orphan logs-tmp
          git rm -rf --quiet .
          cp /tmp/deploy.log deploy.log
          git add deploy.log
          git commit -q -m "Server-Protokoll ${GITHUB_RUN_NUMBER}"
          git push -f -q origin HEAD:refs/heads/server-logs
